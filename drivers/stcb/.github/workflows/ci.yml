name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: Manifest validator self-test
        run: python scripts/validate_manifest.py --self-test
      - name: Manifest + no-internal-import gate
        run: python scripts/validate_manifest.py plugin.yaml --dir .
