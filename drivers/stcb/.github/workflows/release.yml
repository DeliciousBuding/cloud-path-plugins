name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Verify tag matches manifest version
        run: |
          set -euo pipefail
          manifest_version="$(awk '/^version:/{print $2; exit}' plugin.yaml)"
          test "v${manifest_version}" = "${GITHUB_REF_NAME}"
      - name: Build + checksum
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          bin="cloudpath-driver-stcb_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then bin="$bin.exe"; fi
          go build -trimpath -o "dist/$bin" ./cmd/cloudpath-driver-stcb
          sha256sum "dist/$bin" > "dist/$bin.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -la release-assets
      - name: Write manifest and license notices into release
        run: cp plugin.yaml LICENSE NOTICE THIRD_PARTY_NOTICES.md release-assets/
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: release-assets/*
          fail_on_unmatched_files: true