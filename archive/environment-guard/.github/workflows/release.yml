name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go mod download
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: python scripts/validate_manifest.py --self-test
      - run: python scripts/validate_manifest.py plugin.yaml --dir .
      - name: Match release tag to manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('plugin.yaml').read_text())['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'release tag/manifest mismatch'
          PY
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod
      - run: go mod download
      - name: Build entrypoint
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ext=''
          if [ "$GOOS" = 'windows' ]; then ext='.exe'; fi
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o "dist/cloud-path-app-environment-guard_${RELEASE_TAG}_${GOOS}_${GOARCH}${ext}" ./cmd/cloud-path-app-environment-guard
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Manifest and checksums
        run: |
          cp plugin.yaml release-assets/plugin.yaml
          python - <<'PY'
          import hashlib
          from pathlib import Path
          directory = Path('release-assets')
          files = sorted(p for p in directory.iterdir() if p.is_file())
          checksums = ''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files)
          (directory / 'checksums.txt').write_text(checksums, encoding='utf-8')
          PY
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: true
          files: release-assets/*
