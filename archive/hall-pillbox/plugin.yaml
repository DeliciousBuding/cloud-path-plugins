apiVersion: plugins.cloudpath.dev/v1alpha1
kind: Application
id: io.github.deliciousbuding.cloud-path-app-hall-pillbox
version: 0.1.4
protocol: 1
entrypoint: cloud-path-app-hall-pillbox
compatibility:
  core: ">=0.2.15 <0.3.0"
permissions:
  hardware: []
  network: []
  filesystem: []
  secrets: []
requirements:
  - id: opening
    capability: cloudpath.dev/capability/hall@1
    cardinality: one
  - id: confirm
    capability: cloudpath.dev/capability/key@1
    cardinality: zero-or-one
  - id: reminder-output
    capability: cloudpath.dev/capability/buzzer@1
    cardinality: one
  - id: local-display
    capability: cloudpath.dev/capability/display-text@1
    cardinality: zero-or-one
contributes:
  applications:
    - id: hall-pillbox
      title: 霍尔药盒 2.0
      ui:
        apiVersion: 1
        navigation:
          title: 霍尔药盒
          icon: door-open
          order: 40
          route: hall-pillbox
          visibility: instance-enabled
        pages:
          - id: home
            title: 霍尔药盒
            description: 盒盖开合会带动磁铁靠近或离开霍尔传感器，系统据此识别开盖；提醒时间内开盖记为已确认，提醒结束后才开盖记为迟到确认。
            sections:
              - type: status
                title: 运行状态
                description: 查看药盒是否在线、设置是否已经生效。
                emptyText: 暂无运行状态。
                source: instance
              - type: metrics
                title: 最近一次提醒
                description: 显示最近一次提醒的当前状态、药格和关键时间。
                emptyText: 还没有提醒记录，完成一次提醒后会显示。
                source: records
                recordType: window
                fields:
                  - key: state
                    label: 当前状态
                    values:
                      opened: 等待确认
                      completed: 已确认
                      missed: 已错过
                      completed_late: 迟到确认
                  - key: compartment
                    label: 药格
                  - key: opened_at
                    label: 开启时间
                    format: time
                    hideWhenEmpty: true
                  - key: confirmed_at
                    label: 确认时间
                    format: time
                    hideWhenEmpty: true
              - type: schedule
                title: 自动提醒计划
                description: 按设定时间自动开启提醒；提醒后请打开药盒完成确认。
                emptyText: 暂无自动提醒计划。
                source: records
                recordType: window
              - type: actions
                title: 手动操作
                description: 需要立即测试时，可以在这里手动开启提醒或确认记录。
                emptyText: 暂无手动操作。
                source: manual-jobs
              - type: records
                title: 提醒记录
                description: 查看每次提醒的开盖、确认或错过情况。
                emptyText: 还没有提醒记录。
                source: records
                recordType: window
                presentation: timeline
                fields:
                  - key: title
                    label: 提醒
                  - key: state
                    label: 状态
                    values:
                      opened: 等待确认
                      completed: 已确认
                      missed: 已错过
                      completed_late: 迟到确认
                  - key: opened_at
                    label: 开启时间
                    format: time
                    hideWhenEmpty: true
                  - key: confirmed_at
                    label: 确认时间
                    format: time
                    hideWhenEmpty: true
                  - key: missed_at
                    label: 错过时间
                    format: time
                    hideWhenEmpty: true
              - type: form
                title: 提醒设置
                description: 设置药盒所在时区、药格名称和提醒声音。
                emptyText: 暂无可配置的提醒设置。
                source: config
                fields:
                  - key: app_config.timezone
                    label: 时区
                    type: string
                    description: 填写药盒所在时区，例如 Asia/Shanghai。
                    placeholder: Asia/Shanghai
                    required: true
                  - key: app_config.compartment
                    label: 药格名称
                    type: string
                    description: 给这个药格起一个容易识别的名字，例如 medicine。
                    placeholder: medicine
                    required: true
                  - key: app_config.reminder.freq
                    label: 提醒音档位
                    type: integer
                    description: 0 表示不响；1–9 选择提醒音。
                    minimum: 0
                    maximum: 9
                    default: 0
                  - key: app_config.reminder.duration
                    label: 提醒时长档位
                    type: integer
                    description: 0 表示不响；1–9 数值越大，响的时间越长。
                    minimum: 0
                    maximum: 9
                    default: 0
