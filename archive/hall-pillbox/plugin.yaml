apiVersion: plugins.cloudpath.dev/v1alpha1
kind: Application
id: io.github.deliciousbuding.cloud-path-app-hall-pillbox
version: 0.1.3
protocol: 1
entrypoint: cloud-path-app-hall-pillbox
compatibility:
  core: ">=0.2.15 <0.3.0"
permissions:
  hardware: []
  network: []
  filesystem: []
  secrets: []
requirements:
  - id: opening
    capability: cloudpath.dev/capability/hall@1
    cardinality: one
  - id: confirm
    capability: cloudpath.dev/capability/key@1
    cardinality: zero-or-one
  - id: reminder-output
    capability: cloudpath.dev/capability/buzzer@1
    cardinality: one
  - id: local-display
    capability: cloudpath.dev/capability/display-text@1
    cardinality: zero-or-one
contributes:
  applications:
    - id: hall-pillbox
      title: 霍尔药盒 2.0
      ui:
        apiVersion: 1
        navigation:
          title: 霍尔药盒
          icon: door-open
          order: 40
          route: hall-pillbox
          visibility: instance-enabled
        pages:
          - id: home
            title: 霍尔药盒
            sections:
              - type: status
                source: instance
              - type: metrics
                source: records
                recordType: window
              - type: schedule
                source: records
                recordType: window
              - type: actions
                source: manual-jobs
              - type: records
                source: records
                recordType: window
                presentation: timeline
              - type: form
                source: config
                fields:
                  - key: app_config.timezone
                    label: 时区
                    type: string
                    description: 按 IANA 时区名称填写，例如 Asia/Shanghai。
                    placeholder: Asia/Shanghai
                    required: true
                  - key: app_config.compartment
                    label: 药格标识
                    type: string
                    description: 插件内部使用的稳定 ID，例如 medicine；不是按键或设备 ID。
                    placeholder: medicine
                    required: true
                  - key: app_config.reminder.freq
                    label: 提醒音档位
                    type: integer
                    description: 0 为静音；1–9 为蜂鸣器频率档。
                    minimum: 0
                    maximum: 9
                    default: 0
                  - key: app_config.reminder.duration
                    label: 提醒时长档位
                    type: integer
                    description: 0 为不发声；1–9 为蜂鸣器时长档。
                    minimum: 0
                    maximum: 9
                    default: 0
