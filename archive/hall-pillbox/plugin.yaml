apiVersion: plugins.cloudpath.dev/v1alpha1
kind: Application
id: io.github.deliciousbuding.cloud-path-app-hall-pillbox
version: 0.1.2
protocol: 1
entrypoint: cloud-path-app-hall-pillbox
compatibility:
  core: ">=0.2.15 <0.3.0"
permissions:
  hardware: []
  network: []
  filesystem: []
  secrets: []
requirements:
  - id: opening
    capability: cloudpath.dev/capability/hall@1
    cardinality: one
  - id: confirm
    capability: cloudpath.dev/capability/key@1
    cardinality: zero-or-one
  - id: reminder-output
    capability: cloudpath.dev/capability/buzzer@1
    cardinality: one
  - id: local-display
    capability: cloudpath.dev/capability/display-text@1
    cardinality: zero-or-one
contributes:
  applications:
    - id: hall-pillbox
      title: 霍尔药盒 2.0
      ui:
        apiVersion: 1
        navigation:
          title: 霍尔药盒
          icon: door-open
          order: 40
          route: hall-pillbox
          visibility: instance-enabled
        pages:
          - id: home
            title: 霍尔药盒
            sections:
              - type: status
              - type: metrics
                source: instance
              - type: schedule
                source: records
                recordType: window
              - type: actions
                source: manual-jobs
              - type: records
                recordType: window
                presentation: timeline
              - type: form
                source: config
