apiVersion: plugins.cloudpath.dev/v1alpha1
kind: Application
id: io.github.deliciousbuding.cloud-path-app-hall-pillbox
version: 0.1.8
protocol: 1
entrypoint: cloud-path-app-hall-pillbox
compatibility:
  core: ">=0.2.29 <0.3.0"
permissions:
  hardware: []
  network: []
  filesystem: []
  secrets: []
requirements:
  - id: opening
    capability: cloudpath.dev/capability/hall@1
    cardinality: one
  - id: confirm
    capability: cloudpath.dev/capability/key@1
    cardinality: zero-or-one
  - id: reminder-output
    capability: cloudpath.dev/capability/buzzer@1
    cardinality: one
  - id: local-display
    capability: cloudpath.dev/capability/display-text@1
    cardinality: zero-or-one
contributes:
  applications:
    - id: hall-pillbox
      title: 霍尔药盒 2.0
      ui:
        apiVersion: 1
        navigation:
          title: 霍尔药盒
          icon: door-open
          order: 40
          route: hall-pillbox
          visibility: always
          i18n:
            zh-CN: 霍尔药盒
            en-US: Hall pillbox
        pages:
          - id: home
            title: 霍尔药盒
            description: 盒盖开合会带动磁铁靠近或离开霍尔传感器，系统据此识别开盖；提醒时间内开盖记为已确认，提醒结束后才开盖记为迟到确认。
            sections:
              - type: status
                title: 运行状态
                description: 查看药盒是否在线、设置是否已经生效。
                emptyText: 暂无运行状态。
                source: instance
                i18n:
                  zh-CN: 运行状态
                  en-US: Status
                  zh-CN.description: 查看药盒是否在线、设置是否已经生效。
                  en-US.description: Check whether the pillbox is online and whether the settings have taken effect.
                  zh-CN.emptyText: 暂无运行状态。
                  en-US.emptyText: No status available.
              - type: metrics
                title: 最近一次提醒
                description: 显示最近一次提醒的当前状态、药格和关键时间。
                emptyText: 还没有提醒记录，完成一次提醒后会显示。
                source: records
                recordType: window
                fields:
                  - key: state
                    label: 当前状态
                    values:
                      opened: 等待确认
                      completed: 已确认
                      missed: 已错过
                      completed_late: 迟到确认
                    i18n:
                      zh-CN: 当前状态
                      en-US: Current status
                    valuesI18n:
                      opened:
                        zh-CN: 等待确认
                        en-US: Awaiting confirmation
                      completed:
                        zh-CN: 已确认
                        en-US: Confirmed
                      missed:
                        zh-CN: 已错过
                        en-US: Missed
                      completed_late:
                        zh-CN: 迟到确认
                        en-US: Late confirmation
                  - key: compartment
                    label: 药格
                    i18n:
                      zh-CN: 药格
                      en-US: Compartment
                  - key: opened_at
                    label: 开启时间
                    format: time
                    hideWhenEmpty: true
                    i18n:
                      zh-CN: 开启时间
                      en-US: Opened at
                  - key: confirmed_at
                    label: 确认时间
                    format: time
                    hideWhenEmpty: true
                    i18n:
                      zh-CN: 确认时间
                      en-US: Confirmation time
                i18n:
                  zh-CN: 最近一次提醒
                  en-US: Latest reminder
                  zh-CN.description: 显示最近一次提醒的当前状态、药格和关键时间。
                  en-US.description: Show the status, compartment, and key times of the latest reminder.
                  zh-CN.emptyText: 还没有提醒记录，完成一次提醒后会显示。
                  en-US.emptyText: No reminder records yet. They will appear after a reminder is completed.
              - type: schedule
                source: jobs
                title: 自动提醒计划
                description: 按设定时间自动开启提醒；提醒后请打开药盒完成确认。
                emptyText: 暂无自动提醒计划。
                i18n:
                  zh-CN: 自动提醒计划
                  en-US: Automatic reminder schedule
                  zh-CN.description: 按设定时间自动开启提醒；提醒后请打开药盒完成确认。
                  en-US.description: Reminders start automatically at the configured time; open the pillbox afterwards to confirm.
                  zh-CN.emptyText: 暂无自动提醒计划。
                  en-US.emptyText: No automatic reminder schedule yet.
              - type: actions
                title: 手动操作
                description: 需要立即测试时，可以在这里手动开启提醒或确认记录。
                emptyText: 暂无手动操作。
                source: manual-jobs
                i18n:
                  zh-CN: 手动操作
                  en-US: Manual actions
                  zh-CN.description: 需要立即测试时，可以在这里手动开启提醒或确认记录。
                  en-US.description: To test immediately, start a reminder or confirm a record here.
                  zh-CN.emptyText: 暂无手动操作。
                  en-US.emptyText: No manual actions.
              - type: records
                title: 提醒记录
                description: 查看每次提醒的开盖、确认或错过情况。
                emptyText: 还没有提醒记录。
                source: records
                recordType: window
                presentation: timeline
                fields:
                  - key: title
                    label: 提醒
                    i18n:
                      zh-CN: 提醒
                      en-US: Reminder
                  - key: state
                    label: 状态
                    values:
                      opened: 等待确认
                      completed: 已确认
                      missed: 已错过
                      completed_late: 迟到确认
                    i18n:
                      zh-CN: 状态
                      en-US: Status
                    valuesI18n:
                      opened:
                        zh-CN: 等待确认
                        en-US: Awaiting confirmation
                      completed:
                        zh-CN: 已确认
                        en-US: Confirmed
                      missed:
                        zh-CN: 已错过
                        en-US: Missed
                      completed_late:
                        zh-CN: 迟到确认
                        en-US: Late confirmation
                  - key: opened_at
                    label: 开启时间
                    format: time
                    hideWhenEmpty: true
                    i18n:
                      zh-CN: 开启时间
                      en-US: Opened at
                  - key: confirmed_at
                    label: 确认时间
                    format: time
                    hideWhenEmpty: true
                    i18n:
                      zh-CN: 确认时间
                      en-US: Confirmation time
                  - key: missed_at
                    label: 错过时间
                    format: time
                    hideWhenEmpty: true
                    i18n:
                      zh-CN: 错过时间
                      en-US: Missed at
                i18n:
                  zh-CN: 提醒记录
                  en-US: Reminder records
                  zh-CN.description: 查看每次提醒的开盖、确认或错过情况。
                  en-US.description: View opening, confirmation, or missed status for each reminder.
                  zh-CN.emptyText: 还没有提醒记录。
                  en-US.emptyText: No reminder records yet.
              - type: form
                title: 提醒设置
                description: 配置药盒所在时区、药格标识、每日提醒计划和提醒声音。
                emptyText: 暂无可配置的提醒设置。
                source: config
                fields:
                  - key: app_config.timezone
                    label: 时区
                    type: string
                    description: 填写药盒所在时区，例如 Asia/Shanghai。
                    placeholder: Asia/Shanghai
                    required: true
                    i18n:
                      zh-CN: 时区
                      en-US: Time zone
                      zh-CN.description: 填写药盒所在时区，例如 Asia/Shanghai。
                      en-US.description: Enter the pillbox time zone, for example Asia/Shanghai.
                  - key: app_config.compartment
                    label: 药格标识
                    type: string
                    description: 必填；1–128 个 UTF-8 字节，不能有首尾空白，例如 medicine。它是应用自己的逻辑标识，不是 Driver、串口或按键实体 ID。
                    placeholder: medicine
                    required: true
                    i18n:
                      zh-CN: 药格标识
                      en-US: Compartment ID
                      zh-CN.description: 必填；1–128 个 UTF-8 字节，不能有首尾空白，例如 medicine。它是应用自己的逻辑标识，不是 Driver、串口或按键实体 ID。
                      en-US.description: Required; 1–128 UTF-8 bytes with no leading or trailing whitespace, for example medicine. This is the application's logical ID, not a Driver, serial port, or button entity ID.
                  - key: app_config.schedule
                    label: 每日提醒计划
                    type: array
                    description: 至少添加一个窗口；开始和结束时间使用 24 小时制 HH:MM，按药盒所在时区解释。
                    required: true
                    minItems: 1
                    itemFields:
                      - key: id
                        label: 计划 ID
                        type: string
                        description: 每个窗口的唯一标识，例如 morning。
                        placeholder: morning
                        required: true
                        i18n:
                          zh-CN: 计划 ID
                          en-US: Schedule ID
                          zh-CN.description: 每个窗口的唯一标识，例如 morning。
                          en-US.description: Unique ID for each window, for example morning.
                      - key: compartment
                        label: 药格标识（可选）
                        type: string
                        description: 可留空；留空时使用上方“药格标识”，填写时必须完全一致。
                        placeholder: medicine
                        i18n:
                          zh-CN: 药格标识（可选）
                          en-US: Compartment ID (optional)
                          zh-CN.description: 可留空；留空时使用上方“药格标识”，填写时必须完全一致。
                          en-US.description: Can be left blank; if blank, the Compartment ID above is used. If provided, it must match exactly.
                      - key: start
                        label: 开始时间
                        type: string
                        description: 24 小时制 HH:MM，例如 08:00。
                        placeholder: "08:00"
                        required: true
                        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                        i18n:
                          zh-CN: 开始时间
                          en-US: Start time
                          zh-CN.description: 24 小时制 HH:MM，例如 08:00。
                          en-US.description: 24-hour HH:MM, for example 08:00.
                      - key: end
                        label: 结束时间
                        type: string
                        description: 24 小时制 HH:MM，必须晚于开始时间；不支持跨午夜。
                        placeholder: "08:30"
                        required: true
                        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                        i18n:
                          zh-CN: 结束时间
                          en-US: End time
                          zh-CN.description: 24 小时制 HH:MM，必须晚于开始时间；不支持跨午夜。
                          en-US.description: 24-hour HH:MM; must be later than the start time and cannot cross midnight.
                    i18n:
                      zh-CN: 每日提醒计划
                      en-US: Daily reminder schedule
                      zh-CN.description: 至少添加一个窗口；开始和结束时间使用 24 小时制 HH:MM，按药盒所在时区解释。
                      en-US.description: Add at least one window; start and end times use 24-hour HH:MM and are interpreted in the pillbox time zone.
                  - key: app_config.reminder.freq
                    label: 提醒音档位
                    type: integer
                    description: 0 表示不响；1–9 选择提醒音。
                    minimum: 0
                    maximum: 9
                    default: 0
                    i18n:
                      zh-CN: 提醒音档位
                      en-US: Reminder sound level
                      zh-CN.description: 0 表示不响；1–9 选择提醒音。
                      en-US.description: 0 means silent; 1–9 selects a reminder sound.
                  - key: app_config.reminder.duration
                    label: 提醒时长档位
                    type: integer
                    description: 0 表示不响；1–9 数值越大，响的时间越长。
                    minimum: 0
                    maximum: 9
                    default: 0
                    i18n:
                      zh-CN: 提醒时长档位
                      en-US: Reminder duration level
                      zh-CN.description: 0 表示不响；1–9 数值越大，响的时间越长。
                      en-US.description: 0 means silent; 1–9 selects a longer reminder duration.
                i18n:
                  zh-CN: 提醒设置
                  en-US: Reminder settings
                  zh-CN.description: 配置药盒所在时区、药格标识、每日提醒计划和提醒声音。
                  en-US.description: Configure the pillbox time zone, compartment ID, daily reminder schedule, and reminder sound.
                  zh-CN.emptyText: 暂无可配置的提醒设置。
                  en-US.emptyText: No reminder settings are available.
            i18n:
              zh-CN: 霍尔药盒
              en-US: Hall pillbox
              zh-CN.description: 盒盖开合会带动磁铁靠近或离开霍尔传感器，系统据此识别开盖；提醒时间内开盖记为已确认，提醒结束后才开盖记为迟到确认。
              en-US.description: Opening or closing the lid moves a magnet toward or away from the Hall sensor, which the system uses to detect opening. Opening during the reminder window counts as confirmed; opening after it ends counts as late confirmation.
      i18n:
        zh-CN: 霍尔药盒 2.0
        en-US: Hall pillbox 2.0
