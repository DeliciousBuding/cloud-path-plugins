{
  "apiVersion": "plugins.cloudpath.dev/v1alpha1",
  "kind": "Application",
  "id": "io.github.deliciousbuding.cloud-path-app-music-player",
  "version": "0.2.1",
  "protocol": 1,
  "entrypoint": "cloud-path-app-music-player",
  "compatibility": {
    "core": ">=0.2.15 <0.3.0"
  },
  "permissions": {
    "hardware": [],
    "network": [],
    "filesystem": [],
    "secrets": []
  },
  "requirements": [
    {
      "id": "sound",
      "capability": "cloudpath.dev/capability/buzzer@1",
      "cardinality": "one"
    },
    {
      "id": "local-display",
      "capability": "cloudpath.dev/capability/display-text@1",
      "cardinality": "zero-or-one"
    },
    {
      "id": "indicator",
      "capability": "cloudpath.dev/capability/led@1",
      "cardinality": "zero-or-one"
    }
  ],
  "contributes": {
    "applications": [
      {
        "id": "music-player",
        "title": "音乐播放器",
        "ui": {
          "apiVersion": 1,
          "navigation": {
            "title": "音乐播放器",
            "icon": "music",
            "order": 50,
            "route": "music",
            "visibility": "instance-enabled"
          },
          "pages": [
            {
              "id": "home",
              "title": "音乐播放器",
              "sections": [
                {
                  "type": "status",
                  "source": "instance"
                },
                {
                  "type": "actions",
                  "source": "manual-jobs"
                },
                {
                  "type": "records",
                  "source": "records",
                  "recordType": "playback",
                  "presentation": "timeline"
                }
              ]
            }
          ]
        }
      }
    ]
  }
}
