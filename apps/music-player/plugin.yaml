{
  "apiVersion": "plugins.cloudpath.dev/v1alpha1",
  "kind": "Application",
  "id": "io.github.deliciousbuding.cloud-path-app-music-player",
  "version": "0.2.3",
  "protocol": 1,
  "entrypoint": "cloud-path-app-music-player",
  "compatibility": {
    "core": ">=0.2.15 <0.3.0"
  },
  "permissions": {
    "hardware": [],
    "network": [],
    "filesystem": [],
    "secrets": []
  },
  "requirements": [
    {
      "id": "sound",
      "capability": "cloudpath.dev/capability/buzzer@1",
      "cardinality": "one"
    },
    {
      "id": "local-display",
      "capability": "cloudpath.dev/capability/display-text@1",
      "cardinality": "zero-or-one"
    },
    {
      "id": "indicator",
      "capability": "cloudpath.dev/capability/led@1",
      "cardinality": "zero-or-one"
    }
  ],
  "contributes": {
    "applications": [
      {
        "id": "music-player",
        "title": "音乐播放器",
        "ui": {
          "apiVersion": 1,
          "navigation": {
            "title": "音乐播放器",
            "icon": "music",
            "order": 50,
            "route": "music",
            "visibility": "instance-enabled"
          },
          "pages": [
            {
              "id": "home",
              "title": "音乐播放器",
              "description": "可以远程选择内置歌曲并播放，也可以播放一个指定音符。",
              "sections": [
                {
                  "type": "status",
                  "source": "instance",
                  "title": "播放设备",
                  "description": "查看音乐播放器当前是否可用。",
                  "emptyText": "暂无设备状态。"
                },
                {
                  "type": "metrics",
                  "source": "records",
                  "recordType": "music_session",
                  "title": "播放概览",
                  "description": "显示最近一次播放的歌曲、状态、进度和排队时间。",
                  "emptyText": "还没有播放记录。",
                  "fields": [
                    {
                      "key": "song",
                      "label": "当前歌曲",
                      "values": {
                        "little-star": "小星星",
                        "birthday": "生日歌",
                        "ode-to-joy": "欢乐颂"
                      },
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "status",
                      "label": "播放状态",
                      "values": {
                        "idle": "未开始",
                        "queued": "等待播放",
                        "playing": "播放中",
                        "completed": "播放完成",
                        "failed": "播放失败"
                      }
                    },
                    {
                      "key": "completed_notes",
                      "label": "播放进度",
                      "unit": "个音符",
                      "precision": 0,
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "queued_at",
                      "label": "排队时间",
                      "format": "time",
                      "hideWhenEmpty": true
                    }
                  ]
                },
                {
                  "type": "actions",
                  "source": "manual-jobs",
                  "title": "播放控制",
                  "description": "选择“播放内置歌曲”播放预设曲目，或使用“播放单音”播放单个音符。",
                  "emptyText": "暂无可用的播放操作。"
                },
                {
                  "type": "records",
                  "source": "records",
                  "recordType": "music_session",
                  "presentation": "timeline",
                  "title": "播放记录",
                  "description": "按时间查看最近的播放情况。",
                  "emptyText": "还没有播放记录。",
                  "fields": [
                    {
                      "key": "title",
                      "label": "标题"
                    },
                    {
                      "key": "summary",
                      "label": "播放概况"
                    },
                    {
                      "key": "song",
                      "label": "歌曲",
                      "values": {
                        "little-star": "小星星",
                        "birthday": "生日歌",
                        "ode-to-joy": "欢乐颂"
                      }
                    },
                    {
                      "key": "status",
                      "label": "状态",
                      "values": {
                        "idle": "未开始",
                        "queued": "等待播放",
                        "playing": "播放中",
                        "completed": "播放完成",
                        "failed": "播放失败"
                      }
                    },
                    {
                      "key": "queued_at",
                      "label": "排队时间",
                      "format": "time",
                      "hideWhenEmpty": true
                    }
                  ]
                }
              ]
            }
          ]
        }
      }
    ]
  }
}
