{
  "apiVersion": "plugins.cloudpath.dev/v1alpha1",
  "kind": "Application",
  "id": "io.github.deliciousbuding.cloud-path-app-sensor-alert",
  "version": "0.1.6",
  "protocol": 1,
  "entrypoint": "cloud-path-app-sensor-alert",
  "compatibility": {
    "core": ">=0.2.15 <0.3.0"
  },
  "permissions": {
    "hardware": [],
    "network": [],
    "filesystem": [],
    "secrets": []
  },
  "requirements": [
    {
      "id": "temperature",
      "capability": "cloudpath.dev/capability/temperature@1",
      "cardinality": "zero-or-one"
    },
    {
      "id": "illuminance",
      "capability": "cloudpath.dev/capability/illuminance@1",
      "cardinality": "zero-or-one"
    },
    {
      "id": "contact",
      "capability": "cloudpath.dev/capability/hall@1",
      "cardinality": "zero-or-one"
    },
    {
      "id": "vibration",
      "capability": "cloudpath.dev/capability/vibration@1",
      "cardinality": "zero-or-one"
    },
    {
      "id": "alert-sound",
      "capability": "cloudpath.dev/capability/buzzer@1",
      "cardinality": "zero-or-one"
    },
    {
      "id": "alert-light",
      "capability": "cloudpath.dev/capability/led@1",
      "cardinality": "zero-or-one"
    }
  ],
  "contributes": {
    "applications": [
      {
        "id": "sensor-alert",
        "title": "通用传感器告警",
        "ui": {
          "apiVersion": 1,
          "navigation": {
            "title": "传感器告警",
            "icon": "bell-ring",
            "order": 40,
            "route": "sensor-alert",
            "visibility": "always"
          },
          "pages": [
            {
              "id": "home",
              "title": "传感器告警",
              "description": "监测温度、光照、接触和振动，达到设定条件时发出声光提醒，并记录每次告警。",
              "sections": [
                {
                  "type": "status",
                  "title": "运行状态",
                  "description": "查看告警功能是否已经启用，以及设备和平台是否连接正常。",
                  "emptyText": "暂无运行状态信息。",
                  "source": "instance"
                },
                {
                  "type": "metrics",
                  "title": "当前告警",
                  "description": "显示最近一次告警的状态、传感器、当前值和触发时间。",
                  "emptyText": "还没有告警记录。",
                  "source": "records",
                  "recordType": "alert",
                  "fields": [
                    {
                      "key": "state",
                      "label": "告警状态",
                      "values": {
                        "armed": "已启用",
                        "triggered": "已触发",
                        "recovered": "已恢复",
                        "disarmed": "已停用"
                      },
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "sensor",
                      "label": "传感器",
                      "values": {
                        "temperature": "温度",
                        "illuminance": "光照",
                        "contact": "接触",
                        "vibration": "振动"
                      },
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "value",
                      "label": "当前值",
                      "format": "number",
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "triggered_at",
                      "label": "触发时间",
                      "format": "time",
                      "hideWhenEmpty": true
                    }
                  ]
                },
                {
                  "type": "actions",
                  "title": "告警开关",
                  "description": "点击“布防告警”启用告警，点击“撤防告警”停用告警。",
                  "emptyText": "暂无可执行的告警操作。",
                  "source": "manual-jobs"
                },
                {
                  "type": "records",
                  "title": "告警记录",
                  "description": "查看每次告警发生在哪个传感器、当时是什么状态、数值和触发阈值。",
                  "emptyText": "还没有告警记录。",
                  "source": "records",
                  "recordType": "alert",
                  "presentation": "timeline",
                  "fields": [
                    {
                      "key": "sensor",
                      "label": "传感器",
                      "values": {
                        "temperature": "温度",
                        "illuminance": "光照",
                        "contact": "接触",
                        "vibration": "振动"
                      },
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "state",
                      "label": "告警状态",
                      "values": {
                        "armed": "已启用",
                        "triggered": "已触发",
                        "recovered": "已恢复",
                        "disarmed": "已停用"
                      },
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "value",
                      "label": "当前值",
                      "format": "number",
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "threshold",
                      "label": "触发阈值",
                      "format": "number",
                      "hideWhenEmpty": true
                    },
                    {
                      "key": "triggered_at",
                      "label": "触发时间",
                      "format": "time",
                      "hideWhenEmpty": true
                    }
                  ]
                },
                {
                  "type": "form",
                  "title": "告警设置",
                  "description": "设置触发告警的条件，以及触发后如何提醒。",
                  "emptyText": "暂无可配置项。",
                  "source": "config",
                  "fields": [
                    {
                      "key": "app_config.temperature_min",
                      "label": "最低温度（℃）",
                      "type": "number",
                      "description": "低于这个温度时触发告警。",
                      "default": 18
                    },
                    {
                      "key": "app_config.temperature_max",
                      "label": "最高温度（℃）",
                      "type": "number",
                      "description": "高于这个温度时触发告警。",
                      "default": 28
                    },
                    {
                      "key": "app_config.light_min",
                      "label": "最低光照",
                      "type": "number",
                      "description": "低于这个数值时触发告警；留空表示不检查。"
                    },
                    {
                      "key": "app_config.light_max",
                      "label": "最高光照",
                      "type": "number",
                      "description": "高于这个数值时触发告警；留空表示不检查。"
                    },
                    {
                      "key": "app_config.contact_enabled",
                      "label": "接触告警",
                      "type": "boolean",
                      "description": "打开后，门、盖或窗被打开时触发告警。",
                      "default": false
                    },
                    {
                      "key": "app_config.vibration_enabled",
                      "label": "振动告警",
                      "type": "boolean",
                      "description": "打开后，检测到明显振动时触发告警。",
                      "default": false
                    },
                    {
                      "key": "app_config.cooldown_s",
                      "label": "重复提醒间隔（秒）",
                      "type": "integer",
                      "description": "同一问题再次触发前至少等待多久；填 0 表示不限制。",
                      "minimum": 0,
                      "maximum": 86400,
                      "default": 60
                    },
                    {
                      "key": "app_config.silent",
                      "label": "静音提醒",
                      "type": "boolean",
                      "description": "打开后只亮指示灯，不发出提示音。",
                      "default": false
                    }
                  ]
                }
              ]
            }
          ]
        }
      }
    ]
  }
}
