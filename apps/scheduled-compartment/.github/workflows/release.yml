name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches manifest
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" {print $2; exit}' plugin.yaml)"
          test "${GITHUB_REF_NAME#v}" = "$version"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./... -count=1

      - name: gofmt gate
        run: test -z "$(gofmt -l .)"

      - name: No core internal imports
        run: |
          if grep -R "github.com/DeliciousBuding/cloud-path/internal" --include="*.go" .; then
            echo "plugin must only depend on the public SDK"; exit 1
          fi

      - name: Manifest validator self-test
        run: python scripts/validate_manifest.py --self-test

      - name: Manifest gate
        run: python scripts/validate_manifest.py plugin.yaml --dir .

  build:
    needs: preflight
    name: build (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true

      - name: Build entrypoint
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          name="cloud-path-app-scheduled-compartment_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}${ext}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/$name" ./cmd/cloud-path-app-scheduled-compartment
          echo "artifact=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd release-assets
          cp ../plugin.yaml plugin.yaml
          sha256sum * > checksums.txt
          ls -l

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
