name: Release

on:
  push:
    tags:
      - 'v*'
      - '*/v*'
      - '*/*/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example apps/example/v1.2.3'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true
          cache-dependency-path: |
            drivers/stcb/go.sum
            apps/scheduled-compartment/go.sum
            apps/button-indicator/go.sum
            apps/music-player/go.sum
            apps/sensor-alert/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate catalog and tag
        run: |
          python scripts/catalog.py --check
          python scripts/catalog.py --resolve-tag "$RELEASE_TAG"
      - name: Build release assets
        run: python scripts/release.py --tag "$RELEASE_TAG" --out dist
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
